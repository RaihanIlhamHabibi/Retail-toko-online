version: '3'
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            APP_URL: 'http://localhost:${APP_PORT:-8000}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-abangkuh_shop}'
            DB_USERNAME: abangkuh
            DB_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
            REDIS_HOST: redis
            REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}'
            CACHE_DRIVER: redis
            JWT_SECRET: '${JWT_SECRET:?Set JWT_SECRET in .env}'
            CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-http://localhost:3000}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}'
            MYSQL_ROOT_HOST: localhost
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: abangkuh
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$${MYSQL_ROOT_PASSWORD}"']
            retries: 3
            timeout: 5s
            interval: 10s
    minio:
        image: 'minio/minio:latest'
        ports:
            - '127.0.0.1:${FORWARD_MINIO_PORT:-9000}:9000'
            - '127.0.0.1:${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}'
        volumes:
            - 'sail-minio:/data/minio'
        networks:
            - sail
        command: 'minio server /data/minio --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - curl
                - '-f'
                - 'http://localhost:9000/minio/health/live'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7-alpine'
        command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG']
            retries: 3
            timeout: 5s
            interval: 10s
    storefront:
        build:
            context: ./storefront
            args:
                NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}'
        ports:
            - '${STOREFRONT_PORT:-3000}:3000'
        environment:
            NODE_ENV: production
        networks:
            - sail
        depends_on:
            - laravel.test
    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-minio:
        driver: local
    sail-redis:
        driver: local
